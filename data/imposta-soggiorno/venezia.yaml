note: |
  TARIFFE E STAGIONI
  - SÌ, le tariffe cambiano tra alta e bassa stagione. Alta stagione: dal 1° febbraio al 31 dicembre.
    Bassa stagione: solo gennaio (1-31 gennaio), con riduzione del 30% (regolamento art. 5, comma 4,
    lettera c). Le date sono fisse nel regolamento, non cambiano ogni anno.
  - Notte a cavallo tra due periodi: conta il giorno di arrivo (es. arrivo il 31 dicembre = alta
    stagione). Fonte: FAQ pag. 3.
  - Le tariffe sono in euro per persona per notte. Fonte dei valori: opuscolo del Comune "valido dal
    01/04/2025" (pagine 4, 5, 8), che è ancora l'ultimo pubblicato sulla pagina Tariffe IDS. Ho
    controllato le tariffe base sulle delibere: DG 366/2018 per le locazioni turistiche (5, 4, 3 euro
    dal 1/1/2019) e DG 198/2015 punto 1.b per le strutture complementari (2-5 euro secondo i leoni).
    Le tariffe ridotte per zona e stagione sono calcolate dal Comune con le riduzioni del regolamento
    (art. 5, comma 4) e l'arrotondamento al decimo di euro (i 5 centesimi per difetto).
  - valida_dal 2025-04-01 è la data dell'opuscolo e delle ultime modifiche al regolamento: le
    tariffe in sé sono più vecchie (2015 e 2019) e non sono cambiate.

  ZONE
  - Strutture complementari (B&B, case per vacanze, unità abitative ammobiliate, alloggi turistici):
    tariffa piena in Centro storico, Giudecca e isole con principale vocazione ricettiva (San Servolo,
    San Clemente, Sacca Sessola, La Certosa); -20% al Lido e nelle altre isole della laguna (es.
    Murano, Burano); -30% in Terraferma (Mestre e le altre località non insulari).
  - Locazioni turistiche: NESSUNA riduzione per zona (regolamento art. 5, comma 6): stessa tariffa in
    tutto il comune. La tariffa dipende invece dalla categoria catastale dell'immobile:
    Gruppo 1 (A/1, A/8, A/9), Gruppo 2 (A/2, A/3, A/6, A/7, A/11), Gruppo 3 (A/4, A/5).
    Immobili non accatastati o in categorie non abitative pagano come Gruppo 1; se si usano più
    immobili di categorie diverse vale il gruppo più caro (opuscolo pag. 9).
  - Le strutture complementari pagano in base alla classificazione regionale in "leoni" (2-5).

  NOMI USATI DAL COMUNE E SCELTE DI CATEGORIA (DA CONTROLLARE)
  - "Locazioni turistiche art. 27 bis L.R.V. 11/2013": sono gli affitti brevi tipici degli host privati.
  - "Bed & Breakfast" -> categoria bnb.
  - "Casa per vacanze" del Veneto NON è inserita: secondo la Regione è una struttura con servizi comuni
    (case per ferie, ostelli, centri vacanze), non la casa vacanze di un host privato. Per 2-4 leoni le
    tariffe sono comunque uguali a quelle delle unità abitative ammobiliate (correzione del verificatore).
  - "Unità Abitative Ammobiliate ad Uso Turistico" -> casa_vacanze: la Regione Veneto scrive che sono unità
    abitative ammobiliate anche "i Residence, le case e appartamenti vacanze" (fonte regione_unita_abitative).
  - "Alloggi turistici" -> l'ho messa in affittacamere perché la Regione Veneto li descrive come
    strutture da 1 a 6 camere (anche "camere/rooms", locande). Il Comune di Venezia non usa mai la
    parola "affittacamere" e la pagina della Regione non dice che corrispondono. Da confermare.
  - Il Comune chiama l'host "gestore della struttura ricettiva".

  NOTTI MASSIME
  - 5 notti consecutive (regolamento art. 5, comma 3). Se l'ospite cambia struttura senza interruzione
    paga in tutto al massimo 5 notti (FAQ pag. 3). Le notti oltre la quinta si comunicano come "esclusi".
  - Dal 1/4/2025: chi lavora presso strutture sanitarie del Comune paga al massimo 5 notti in tutto
    nell'anno solare, anche non consecutive, con dichiarazione sostitutiva (regolamento art. 5,
    comma 3 bis).

  AIRBNB E VRBO
  - Airbnb: "no". Il Comune, nella news del 15/02/2024 ancora pubblicata sulla pagina News Ufficio
    Tributi (aggiornata il 03/08/2026), dice di non aver aderito ad alcun accordo con Airbnb: le
    strutture devono continuare a riscuotere e versare da sé. Le informative 2026 (n. 2, 3, 4) dicono
    che il gestore versa con PagoPA e non nominano Airbnb. La pagina di aiuto di Airbnb
    (https://www.airbnb.it/help/article/2287) dice solo che riscuote "in alcuni comuni italiani" che
    hanno aderito, senza elenco. Nota: il testo della news l'ho letto tramite uno strumento che
    riassume la pagina: il verificatore controlli il testo esatto.
  - Vrbo: "no" è dedotto, non scritto in modo esplicito: la pagina ufficiale di Vrbo elenca dove
    riscuote in Europa e l'Italia non c'è.

  ALTRE NOVITÀ 2026
  - Dal 26/01/2026 il portale si chiama CityTax++ (informativa 01/IDS/2026 del 16/01/2026:
    https://www.comune.venezia.it/sites/comune.venezia.it/files/documenti/Tributi/ids/2026_01_informativa%20imposta%20di%20soggiorno_AVVIO%20CITYTAX%20.pdf).
  - Dal 2026 nella scheda di ogni struttura sono obbligatori CIN, CIR e dati catastali: senza questi
    dati non si può fare la comunicazione trimestrale. La comunicazione resta trimestrale, ma i dati
    (ospiti e pernottamenti) vanno divisi mese per mese e va "protocollata", altrimenti viene cancellata (informativa 02/2026).
  - Comunicazione in ritardo: si può fare online entro la fine del trimestre successivo, con sanzioni;
    dopo bisogna contattare l'ufficio (FAQ pag. 9 e 11). Sanzione per comunicazione omessa o
    irregolare: da 25 a 500 euro (regolamento art. 9, comma 1).

  2027
  - Non ho trovato nessuna delibera già approvata che cambi le tariffe per il 2027. Le pagine ufficiali
    (Tariffe IDS, Regolamento e Delibere IDS) e l'informativa del 22/09/2026 non parlano di aumenti.
  - Solo come supporto (non ufficiale): un articolo di QuiFinanza del 22/09/2026
    (https://quifinanza.it/lifestyle/travel-economy/venezia-ticket-ingresso-2027-ipotesi/1016391/)
    dice che il Comune "valuta" un aumento dell'imposta di soggiorno, senza delibera né date.
    Da ricontrollare nei prossimi mesi (le tariffe le decide la Giunta, regolamento art. 5, comma 2).

  CONTRIBUTO DI ACCESSO
  - Il "contributo di accesso" (ticket per i visitatori giornalieri) è un tributo diverso e NON è
    l'imposta di soggiorno: non è trattato in questo file. Pagina del Comune:
    https://www.comune.venezia.it/it/cda-info

  DUBBI DA CONTROLLARE
  - Età dei minori: il regolamento dice "minori entro il decimo anno di età", le FAQ e l'opuscolo
    "minori entro i 10 anni (non compiuti)": ho messo esenti fino a 9 anni compresi.
  - Riduzione 50%: il regolamento dice "tra i 10 e i 16 anni", le FAQ dicono "dai 10 ai 15 anni
    compiuti" e tariffa intera dal 16° anno. Ho seguito le FAQ nella descrizione.
  - La pagina "Soggiornare in un alloggio turistico" del Comune (aggiornata 22/01/2024) dice "tariffa
    intera tra 1 e 5 euro": coerente con le tabelle, ma è un riassunto.
  - Mappatura delle categorie "Unità abitative ammobiliate" e "Alloggi turistici" (vedi sopra).
  - Correzione del verificatore: dal 9 all'11 settembre 2026 la stampa (non ufficiale: gruppotv7.com,
    italiareportusa.com; Il Gazzettino e VeneziaToday non apribili) riporta una PROPOSTA del Comune per
    il 2027: fino a 7 € negli alloggi turistici, nuove zone (isole minori a metà tariffa da ottobre a
    marzo, Terraferma con sconti del 16-25%), bassa stagione non più solo a gennaio. Nessuna delibera
    approvata: stagioni e zone potrebbero cambiare. Ricontrollare a dicembre 2026 e gennaio 2027.

  ARROTONDAMENTI
  - Le tariffe ridotte (es. riduzione del 50% per i 10-15 anni) non sono sempre la metà esatta: il
    Comune arrotonda al decimo, con i 5 centesimi per difetto (DG 198/2015 punto 5; opuscolo pag. 1).
    Esempio: locazione Gruppo 1 in bassa stagione ridotta = 1,70 €, non 1,75 € (opuscolo pag. 8).
