# Le tariffe cambiano tra alta e bassa stagione: la bassa stagione è solo gennaio.
stagioni:
  - nome: alta
    periodi:
      - { dal: "02-01", al: "12-31" }
    rif: { fonte: regolamento, punto: "art. 5, comma 4, lettera c) (anche opuscolo tariffe pag. 1)" }
  - nome: bassa
    periodi:
      - { dal: "01-01", al: "01-31" }
    rif: { fonte: opuscolo_tariffe, punto: "pag. 1, periodo di pernottamento: bassa stagione dal 1 gennaio al 31 gennaio (regolamento art. 5, comma 4, lettera c: riduzione del 30% fuori dall'alta stagione)" }

