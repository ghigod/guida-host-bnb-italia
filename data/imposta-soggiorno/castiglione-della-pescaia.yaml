# Imposta di soggiorno - Comune di Castiglione della Pescaia
# Compilato dall'agente ricercatore-imposta il 2026-10-29. BOZZA: da controllare con
# l'agente verificatore-dati e da approvare dal proprietario del sito.
comune: Castiglione della Pescaia
provincia: GR
regione: Toscana
anno: 2026
valida_dal: 2026-01-01
stato: bozza

fonti:
  pagina_comune:
    titolo: "Comune di Castiglione della Pescaia - Sportello telematico - Versare l'imposta di soggiorno (IDS)"
