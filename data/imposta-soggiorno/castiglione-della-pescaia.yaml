  pagina_documenti:
    titolo: "Comune di Castiglione della Pescaia - Documenti relativi imposta di soggiorno (pagina aggiornata il 28/07/2026)"
    url: https://www.comune.castiglionedellapescaia.gr.it/it/documenti_pubblici/documenti-relativi-imposta-di-soggiorno
  delibera:
    titolo: "Deliberazione della Giunta Comunale n. 358 del 20/11/2025 - Approvazione tariffe imposta di soggiorno anno 2026 (allegato 'Tariffe 2026')"
    url: https://www.comune.castiglionedellapescaia.gr.it/s3/1791/allegati/modulistica/imposta-di-soggirono/tariffe-2026.pdf
  regolamento:
    titolo: "Regolamento imposta di soggiorno (allegato 'Regolamento 2025'): C.C. n. 7 del 28/02/2022, modificato con C.C. n. 110 del 29/12/2022, n. 9 del 04/03/2024 e n. 71 del 28/11/2024"
    url: https://www.comune.castiglionedellapescaia.gr.it/s3/1791/allegati/modulistica/imposta-di-soggirono/regolamento-imposta-di-soggiorno-2025.pdf
  regolamento_testo_2024:
    titolo: "Regolamento imposta di soggiorno - testo precedente (fino alla modifica C.C. n. 9 del 04/03/2024), vecchio sito del Comune"
    url: https://old.comune.castiglionedellapescaia.gr.it/wp-content/uploads/2022/03/REGOLAMENTO-IMPOSTA-DI-SOGGIORNO-2024.pdf
  adempimenti_locazioni:
    titolo: "Comune di Castiglione della Pescaia - Adempimenti ai fini delle locazioni turistiche brevi (dal 26/06/2026)"
    url: https://www.comune.castiglionedellapescaia.gr.it/s3/1791/allegati/condizioni-di-servizio/adempimenti-locazioni-turistiche-brevi-dal-26-06-2026.pdf
  airbnb_italia:
