# Il testo 2020 del regolamento dice 5 notti, ma il regolamento è stato modificato dopo
# (2024) e non ho potuto leggere il testo in vigore; alcune fonti non ufficiali dicono 4.
# Vedi note.
notti_massime:
  valore: non_trovato

esenzioni:
  - descrizione: "Residenti nel Comune di Bologna: l'imposta è dovuta solo da chi non è residente"
    rif: { fonte: regolamento, punto: "art. 2, comma 2 (testo 2020)" }
  - descrizione: "Minori di 14 anni"
    eta_fino_a: 13
    rif: { fonte: regolamento, punto: "art. 2, comma 3 (testo 2020)" }
  - descrizione: "Studenti universitari regolarmente iscritti all'Università di Bologna alloggiati in studentati"
    rif: { fonte: regolamento, punto: "art. 2, comma 3 (testo 2020)" }
  - descrizione: "Chi assiste un degente ricoverato (anche in day hospital/day surgery/day service) in ospedali o strutture di cura del territorio: massimo 1 accompagnatore per paziente; entrambi i genitori se il paziente ha meno di 14 anni. Solo per le notti del ricovero, compresa quella prima, con certificazione della struttura sanitaria"
    rif: { fonte: regolamento, punto: "art. 2, comma 4, lettera a) (testo 2020); stesso contenuto nel modulo di esenzione del Comune" }
  - descrizione: "Chi fa cure in day hospital (day surgery/day service), per le notti del periodo di terapia, con certificazione della struttura sanitaria"
    rif: { fonte: regolamento, punto: "art. 2, comma 4, lettera b) (testo 2020); stesso contenuto nel modulo di esenzione del Comune" }
  - descrizione: "Persone alloggiate dal Comune o da altri enti pubblici per emergenze sociali (non sono soggetti passivi)"
    rif: { fonte: regolamento, punto: "art. 2, comma 2, secondo periodo (testo 2020)" }

