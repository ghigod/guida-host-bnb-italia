scadenze:
  - cosa: "Abilitazione al portale GEIS del Comune (con CIN e CIR della struttura)"
    quando: "Prima di iniziare a gestire l'imposta (il modulo non indica un termine preciso)"
    rif: { fonte: modulo_abilitazione_geis, punto: "pag. 1, richiesta ai sensi dell'art. 5 del regolamento" }
  - cosa: "Comunicazione trimestrale al Comune (portale GEIS), una per ogni indirizzo e numero civico. Trimestri: gen-mar, apr-giu, lug-set, ott-dic"
    quando: "Entro 15 giorni dalla fine del trimestre"
    rif: { fonte: regolamento, punto: "art. 5, comma 2, lettera b) (testo 2020)" }
  - cosa: "Versamento al Comune dell'imposta del trimestre (se meno di 5,00 euro si può versare alla scadenza successiva)"
    quando: "Entro 15 giorni dalla fine del trimestre (stessa scadenza della comunicazione)"
    rif: { fonte: regolamento, punto: "art. 5, comma 2, lettera c) (testo 2020)" }
  - cosa: "Dichiarazione annuale (art. 4 comma 1-ter D.Lgs. 23/2011)"
    quando: "Entro il 30 giugno dell'anno successivo"
    rif: { fonte: regolamento, punto: "art. 5, comma 2, lettera e) (testo 2020)" }
  - cosa: "Invio al Comune della certificazione di esenzione per ricoverati/day hospital"
    quando: "Entro 3 giorni lavorativi"
    rif: { fonte: regolamento, punto: "art. 5, comma 2, lettera d) (testo 2020)" }

verificato_il: 2026-10-29

note: |
  TARIFFE 2026
  - Fonte: proposta di delibera di Giunta DG/PRO/2025/283 (documento creato l'11/12/2025; Bologna
    Welcome la cita come "DG/PRO/2025/283 del 9/12/25"). Conferma dal 1/1/2026 al 31/12/2026 le
    tariffe già in vigore dal 1/4/2025 (delibera di Giunta P.G. 861894/2024). Non ho trovato il
    numero definitivo dell'atto approvato né la sua pubblicazione sul portale del MEF.
  - La delibera (punto 3) dice che, se la Legge di Bilancio 2026 non avesse confermato gli aumenti,
    sarebbero tornate le tariffe in vigore al 31/12/2024 (delibera G.C. P.G. 832788/2023, non letta).
    La Legge di Bilancio 2026 (L. 30/12/2025 n. 199, art. 1 comma 683, secondo fonti NON ufficiali:
    leggeinchiaro.it, mysolution.it) ha confermato la possibilità per il 2026. Conferme indirette:
    Bologna Welcome (20/7/2026) e Resto del Carlino (26/12/2025) riportano le tariffe 4,00 / 5,80 /
    6,50 / 7,00 per il 2026. Testo della legge in Gazzetta Ufficiale NON verificato.
  - Bologna non distingue le tariffe per tipo di struttura: conta il prezzo "della camera con
    colazione (al netto di IVA e di eventuali servizi aggiuntivi) relativo al singolo pernottamento
    di una persona". Fasce: 1-30,99 euro → 4,00; 31-70,99 → 5,80; 71-120,99 → 6,50; da 121 → 7,00.
    Campeggi e ostelli: 2,80 fissi (non inseriti, non sono categorie del sito). I nomi delle
    categorie nel campo nome_nel_documento vengono dal regolamento, art. 2 comma 1; la delibera
    nomina solo le fasce.
  - TARIFFA PERCENTUALE (non convertita): quando il canone è incassato direttamente da un portale
    telematico o da un intermediario immobiliare, per le locazioni brevi (art. 4 D.L. 50/2017) e
    per gli appartamenti ammobiliati ad uso turistico (art. 12 L.R. E-R 16/2004), l'imposta è il
    10,50% del costo dell'appartamento (al netto di IVA e servizi aggiuntivi), con un massimo di
    7,00 euro a persona per notte (delibera, punto 1 lettera b, pagg. 4-5; regolamento art. 4
    comma 4). Il regolamento (art. 4 comma 5) permette ai portali convenzionati di usare la
    percentuale anche per altre strutture. Per il calcolatore del sito questo punto è importante.

  STAGIONI
  - Nessuna differenza tra alta e bassa stagione: una sola tabella, valida tutto l'anno.

  NOTTI MASSIME (NON TROVATO: da verificare)
  - Il testo originale 2020 del regolamento dice: massimo 5 pernottamenti consecutivi (art. 4
    comma 1), anche se il soggiorno è in più strutture (comma 7); se i pernottamenti sono ripetuti
    nello stesso mese, si pagano solo i primi 5 (comma 8).
  - Il regolamento però è stato modificato più volte; l'ultima modifica è la delibera di Consiglio
    P.G. 848364/2024 del 25/11/2024 (in vigore dal 1/2/2025 secondo CNA Bologna). Il testo
    aggiornato non si è potuto leggere: la pagina del Comune non si apre con WebFetch e non l'ho
    trovato sul portale del MEF.
  - Fonti non ufficiali in contrasto: Holidu e vertoai.it dicono 4 notti; altre dicono 5. Per
    questo non ho scelto. Conferma: Ufficio Imposta di soggiorno, impostadisoggiorno@comune.bologna.it,
    tel. 051 2193376.

  ESENZIONI E RIDUZIONI
  - Le esenzioni vengono dal testo 2020 del regolamento: potrebbero essere cambiate.
  - Bologna Welcome (non ufficiale, 20/7/2026) aggiunge un'esenzione che il testo 2020 non ha:
    persone con disabilità grave (L. 104/92 art. 3 comma 3, o norme analoghe estere) e un
    accompagnatore. Probabilmente introdotta con una modifica successiva: non inserita, da verificare
    sul regolamento in vigore.
  - Altre esenzioni citate solo da un blog (vertoai.it: forze dell'ordine, donatori, autisti di
    pullman ecc.): non verificate, non inserite.
  - Nessuna riduzione percentuale nel testo 2020.

  AIRBNB E VRBO
  - Airbnb: "non_verificato". Le pagine ufficiali di Airbnb (help 2287 e 2509) dicono che Airbnb
    riscuote e versa in Italia nei comuni registrati al suo portale, ma non nominano Bologna. Il
    comunicato ufficiale del Comune (4/12/2024) dice che, quando "incasso e versamento" avvengono
    tramite portali telematici o intermediari, si applica il 10,5% con massimo 7 euro: conferma
    che esistono portali che riscuotono, ma non nomina Airbnb. Una notizia del newsroom Airbnb
    (2018, su Palermo) cita un accordo già fatto con Bologna: datata, non usata come fonte.
    Conferma definitiva: Ufficio Imposta di soggiorno del Comune.
  - Vrbo: "no" è dedotto: la pagina ufficiale di Vrbo elenca dove riscuote in Europa e l'Italia
    non c'è. Chi usa Vrbo deve riscuotere e versare da sé.

  SCADENZE
  - Dal testo 2020 del regolamento (art. 5): da verificare sul testo aggiornato.
  - Il testo 2020 (art. 11 comma 6, disposizione transitoria) chiedeva anche il "conto giudiziale"
    (modello 21) entro il 30 gennaio dell'anno dopo. Non inserito tra le scadenze: non so se valga
    ancora.
  - Versamento: tramite PagoPA o, in via residuale, bonifico (Regolamento entrate comunali, art. 37
    comma 2, in vigore dal 1/5/2024).

  NOME USATO DAL COMUNE
  - Il regolamento (art. 2 comma 1) elenca: "affittacamere", "case e appartamenti per vacanze",
    "appartamenti ammobiliati per uso turistico", "attività saltuarie di alloggio e prima colazione
    (bed & breakfast)" e "immobili destinati alla locazione breve, di cui all'art. 4 del D.L.
    50/2017". La delibera tariffe parla di "locazione breve" e "locazione di appartamenti
    ammobiliati ad uso turistico".

  2027
  - Non ho trovato delibere già approvate per il 2027. La delibera 2026 vale solo fino al
    31/12/2026 perché legata alla Legge di Bilancio 2026: per il 2027 serve un nuovo atto. Da
    ricontrollare a fine anno.

  BLOCCANTE PRIMA DI VERIFICARE (dal verificatore, 29/10/2026)
  - Il regolamento usato è il testo ORIGINALE 2020, poi modificato tre volte (n. 579531/21 del 23/12/2021;
    n. 797595/23 del 29/11/2023; n. 110 del 27/11/2024, pubblicata sul MEF il 27/12/2024, in vigore dal
    1/2/2025). Il testo coordinato in vigore non è stato trovato: esenzioni, scadenze e art. 4 vanno
    ricontrollati. La modifica 2024 semplifica gli adempimenti dell'art. 5 c. 2 e lascia ai portali
    solo le locazioni brevi (art. 4 c. 4-5).
  - Il massimo di 7 € per la tariffa percentuale viene dalla delibera 2026, non dal regolamento 2020
    (che diceva 5 €; la modifica 2024 rinvia al limite di legge).
  - La delibera 2026 risulta adottata il 09/12/2025 e pubblicata sul portale MEF il 30/12/2025 (elenco
    delibere 2026, codice A944): per legge varrebbe dal 1/2/2026, il testo dice dal 1/1/2026. Da chiarire.
  - Accompagnatori di ricoverati: il modulo ufficiale attuale dice "genitore o accompagnatore del degente
    minore di 14 anni, al massimo due persone per paziente" (formulazione più recente del regolamento 2020).
  - Esenzione probabile non inserita: persone con disabilità grave (L. 104/92) e un accompagnatore, forse
    introdotta con la modifica del 2021 (solo fonti non ufficiali).
  - Contatti dai moduli ufficiali: impostadisoggiorno@comune.bologna.it, call center 051 0185048,
    numero verde 800 037 688.
