esenzioni:
  - descrizione: "Residenti nel Comune di Napoli: l'imposta è dovuta solo da chi non è residente e non è iscritto all'anagrafe del Comune"
    rif: { fonte: regolamento, punto: "art. 3, comma 1" }
  - descrizione: "Minori entro il quattordicesimo anno d'età (la pagina del Comune dice: l'imposta è dovuta dai soggetti di età maggiore di 14 anni). Età esatta da verificare, vedi note"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera a)" }
  - descrizione: "Pazienti in trattamento sanitario in day-hospital presso strutture sanitarie del territorio comunale, con certificazione della struttura sanitaria"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera b) e comma 2" }
  - descrizione: "Chi assiste degenti ricoverati in strutture sanitarie: un accompagnatore per paziente; se il paziente è minore, entrambi i genitori. Servono certificazione della struttura sanitaria e autodichiarazione"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera c) e comma 2" }
  - descrizione: "Rifugiati politici, con il tesserino della Commissione Territoriale"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera d) e comma 3" }
  - descrizione: "Forze dell'Ordine alloggiate per provvedimenti delle autorità pubbliche (emergenze sociali, calamità, soccorso umanitario), con autocertificazione"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera e) e comma 4" }
  - descrizione: "Volontari della Protezione Civile e della Croce Rossa in servizio in occasione di calamità, con autocertificazione"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera f) e comma 4" }
  - descrizione: "Persone con disabilità non inferiore all'80% certificata (o analoga certificazione estera), più un accompagnatore"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera g) e comma 4" }
  - descrizione: "Autisti di pullman e accompagnatori turistici di gruppi organizzati da agenzie di viaggio (un accompagnatore ogni 25 partecipanti)"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera h) e comma 4" }
  - descrizione: "Personale dipendente della struttura che vi lavora"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera i) e comma 4" }
  - descrizione: "Persone ospitate gratis su richiesta del Comune o di altro ente pubblico (con assenso del Comune) per promuovere il territorio"
    rif: { fonte: regolamento, punto: "art. 7, comma 1, lettera j)" }

