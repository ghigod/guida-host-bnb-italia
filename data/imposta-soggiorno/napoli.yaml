    nome_nel_documento: "Strutture ricettive extra alberghiere"
    importo: 5.50
    rif: { fonte: pagina_comune, punto: "tabella tariffe, riga Strutture ricettive extra alberghiere, colonna €/notte Dal 01/05/2026 (che le case vacanza, anche non imprenditoriali, siano extralberghiere: suap_extralberghiere, pag. 1-2)" }
  - categoria: bnb
    nome_nel_documento: "Strutture ricettive extra alberghiere"
    importo: 5.50
    rif: { fonte: comunicato_tariffe_2026, punto: "Strutture extra-alberghiere (B&B, Affittacamere, ecc.): 5,50 € dal 1/5/2026" }
  - categoria: affittacamere
    nome_nel_documento: "Strutture ricettive extra alberghiere"
    importo: 5.50
    rif: { fonte: comunicato_tariffe_2026, punto: "Strutture extra-alberghiere (B&B, Affittacamere, ecc.): 5,50 € dal 1/5/2026" }

notti_massime:
