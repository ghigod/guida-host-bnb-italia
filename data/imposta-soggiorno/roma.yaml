verificato_il: 2026-10-29

note: |
  NOME E TARIFFE
  - A Roma si chiama "contributo di soggiorno", non "imposta di soggiorno".
  - Tariffe della delibera di Giunta Capitolina n. 255 del 17/07/2023, in vigore dal 1° ottobre 2023
    (punto 2 del dispositivo, pag. 5). Il titolo dice "tariffe per l'anno 2023", ma non ho trovato
    delibere tariffarie successive: la pagina del Comune (ottobre 2026) collega ancora la n. 255/2023
    e la tabella "dal 01.10.2023". Secondo Turismo Roma le nuove tariffe valgono per le notti dal
    1/10/2023, anche se la prenotazione è stata fatta prima.
  - Le locazioni brevi compaiono in due voci, entrambe a 6,00 euro: "Immobili destinati alla locazione
    breve (art. 4 D.L. 50/2017)" e "Alloggi per uso turistico (Reg. Reg. Lazio 8/2015)". Case vacanza,
    affittacamere e guest house hanno categorie con tariffe diverse (5,00 / 6,00 / 7,00 euro): la
    categoria è quella della classificazione regionale della struttura (Reg. Reg. Lazio 8/2015).
  - Dal 2024 il regolamento non contiene più la tabella delle tariffe (Allegato A eliminato con la
    DAC 34/2024): tariffe e notti massime le decide la Giunta (art. 6, comma 1).

  STAGIONI E ZONE
  - Nessuna differenza tra alta e bassa stagione: la delibera ha una sola tabella per tutto l'anno.
  - Nessuna tariffa diversa per zona. L'unica regola legata al territorio è l'esenzione per la
    frazione di Polline e Martignano (art. 5, comma 1, lett. b).

  NOTTI MASSIME
  - 10 pernottamenti "consecutivi nell'anno solare effettuati nella medesima struttura" (tabella della
    delibera, per tutte le categorie tranne il campeggio, che ha 5).
  - Per chi pernotta a lungo per studio (corsi attestati) o per lavoro documentato: massimo 10
    pernottamenti complessivi nell'anno solare, anche non continuativi (regolamento art. 6, comma 2).

  RIDUZIONI
  - Il regolamento (DAC 34/2024) non prevede riduzioni percentuali, solo esenzioni (art. 5).
  - L'art. 13-bis prevede un "contributo forfetario" fino all'1,8% del riscosso per i gestori, a
    copertura delle commissioni bancarie: non è uno sconto per l'ospite. La premessa della DAC 34/2024
    dice che è per i gestori "in forma imprenditoriale".

  ESENZIONE MINORI
  - Il regolamento dice "fino al compimento del decimo anno di età": esenti fino a 9 anni compresi
    (come per Firenze con il dodicesimo anno). Alcuni siti scrivono "sotto i 10 anni": stessa cosa.

  AIRBNB E VRBO
  - Airbnb: convenzione con Roma Capitale operativa dal 1° luglio 2020 (Turismo Roma, sito di Roma
    Capitale; comunicato Airbnb del 16/07/2020). Airbnb riscuote alla conferma della prenotazione e
    versa a Roma Capitale ogni trimestre. Per le prenotazioni fatte prima del 1/7/2020 riscuoteva
    l'host. Airbnb non applica le esenzioni alla prenotazione: l'ospite chiede il rimborso.
    Il comunicato del 2020 cita 3,50 euro, la tariffa di allora (oggi 6,00 euro).
  - Il regolamento (art. 4, comma 1) rende "responsabili del contributo" anche i portali telematici.
  - DA VERIFICARE: non ho trovato una fonte ufficiale recente che dica come l'host deve indicare su
    GECOS le notti già riscosse da Airbnb, né se deve comunque fare la comunicazione trimestrale. La
    pagina di aiuto Airbnb sull'Italia (art. 2287) non nomina Roma: dice solo che dal 1/1/2024 Airbnb
    riscuote nei comuni che hanno aderito al suo portale e che presenta lei la dichiarazione annuale
    per le imposte che riscuote. Il comunicato ufficiale Airbnb del 9/2/2024
    (https://news.airbnb.com/it/airbnb-raccolta-e-versamento-dellimposta-di-soggiorno-in-italia/)
    annuncia la riscossione dal 15 febbraio 2024 in circa 1.200 comuni, poi negli altri, senza elenco.
    Per Roma vale la convenzione del 2020; nessuna pagina di comune.roma.it la nomina.
  - Vrbo: "no" è dedotto, non scritto in modo esplicito. La pagina ufficiale Vrbo elenca le località
    europee dove riscuote (Vienna, Francia, Amsterdam) e l'Italia non c'è. Chi usa Vrbo deve
    riscuotere e versare da sé. Conferma: Servizio Gestione Contributo di Soggiorno / ChiamaRoma 060606.

  SCADENZE
  - Comunicazione e versamento trimestrali (non mensili come a Firenze). L'avviso del Comune del
    16/10/2026 conferma: comunicazione su GECOS e pagamento con PagoPA entro il 16 ottobre 2026 per il
    III trimestre 2026. Nel 2025 il Comune ha prorogato una scadenza (II trimestre 2025 spostato al
    23/7/2025) per problemi del portale GECOS (avviso del Comune:
    https://www.comune.roma.it/web/it/informazione-di-servizio.page?contentId=IDS1417866):
    le proroghe vanno controllate di volta in volta.
  - Da controllare a mano: la Deliberazione G.C. n. 62 del 27/02/2026 (PDF troppo grande per gli
    strumenti) non risulta legata al contributo di soggiorno, ma non è stato possibile escluderlo.
  - Somme versate arrotondate all'euro (art. 9, comma 3).
  - Mod. 21 (conto giudiziale): la pagina FAQ del Comune dice che i gestori che riscuotono sono agenti
    contabili e presentano il Mod. 21 entro il 30 gennaio dell'anno dopo. Non è nel regolamento e non
    è chiaro se valga ancora per gli host privati di locazioni brevi: non l'ho messo tra le scadenze.
  - Sanzioni (art. 11): 30% per omesso versamento (15% se il ritardo è entro 90 giorni); dal 100% al
    200% per dichiarazione annuale omessa o infedele; da 25 a 500 euro per gli altri obblighi.

  2027 E GIUBILEO
  - Non ho trovato delibere già approvate per il 2027, né tariffe speciali per il Giubileo 2025.
    Il sindaco ha chiesto più autonomia per alzare il contributo (articoli di stampa del 2026), ma non
    risulta nessun atto approvato. Da ricontrollare a fine anno con il bilancio di previsione 2027.

  FONTI NON LETTE PER INTERO
  - Ho letto per intero la delibera G.C. 255/2023, il regolamento (DAC 34/2024) e la tabella tariffe
    del Comune. La pagina del Comune non mostra una data di aggiornamento.
